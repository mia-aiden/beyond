model_name_or_path: /root/autodl-tmp/Meta-Llama-3-8B-Instruct
train_data_path: /root/autodl-fs/sft_experiments/data/joint_train.jsonl
validation_data_path: /root/autodl-fs/sft_experiments/data/joint_validation.jsonl
output_dir: /root/autodl-fs/sft_experiments/ablations/lambda_0_3/models/joint_lora_r8

cutoff_len: 1536
max_source_tokens: 1300
emotion_loss_weight: 0.3

lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: true

logging_steps: 10
eval_steps: 250
save_steps: 250
save_total_limit: 3
dataloader_num_workers: 4
seed: 42
data_seed: 42
resume_from_checkpoint: true
